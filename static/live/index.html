<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krishna Live</title>
<style>
  :root {
    --bg: #11131a; --panel: #181b24; --line: #262b38;
    --text: #e9ecf3; --dim: #98a1b5; --accent: #ff5a5a; --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 760px; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 14px;
  }
  button {
    font: 600 14px system-ui; padding: 9px 16px; border-radius: 9px;
    border: 1px solid var(--line); background: #232838; color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  select {
    font: 14px system-ui; padding: 8px 10px; border-radius: 9px;
    background: #232838; color: var(--text); border: 1px solid var(--line);
  }
  #status { color: var(--dim); font-size: 13px; margin-left: auto; }
  #level {
    height: 6px; border-radius: 3px; background: #232838;
    overflow: hidden; margin-bottom: 14px;
  }
  #level > div { height: 100%; width: 0; background: var(--ok); transition: width .07s; }
  #log {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; min-height: 280px;
  }
  .msg { margin-bottom: 12px; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  .you .who { color: #7dd3fc; }
  .note { color: var(--dim); font-size: 13px; font-style: italic; }
  .tag {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 20px; background: #2a3145; color: var(--dim);
  }
  .tag.live { background: #143a22; color: var(--ok); }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--dim); }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent); }
  #avatarBox { height: 400px; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="wrap">
  <h1>Krishna Live</h1>
  <div class="sub">
    Real barge-in — just start talking and it stops mid-sentence. Nothing
    leaves this machine.
  </div>

  <div class="bar">
    <button id="start" class="primary">Start listening</button>
    <button id="stop" disabled>Stop speaking</button>
    <select id="lang"></select>
    <label class="chk"><input type="checkbox" id="avatarOn"> Avatar</label>
    <span id="status">not connected</span>
  </div>
  <div class="bar" id="avatarBar" style="display:none">
    <select id="face"></select>
    <select id="bg"></select>
    <span class="tag">mounted once — no reload between replies</span>
  </div>
  <div id="level"><div id="levelbar"></div></div>
  <div id="avatarBox" style="display:none"></div>
  <div id="log"></div>
</div>

<script type="module">
const SR = 16000, FRAME = 512;
let ws, ctx, micStream, node, playing = false, queue = [], playSR = 24000;
let nextStart = 0, sources = [];
let head = null, pendingTiming = null;

// Same avatar set and per-avatar corrections as the Streamlit app -- the
// retarget/baseline values are upstream's own, and AvatarSDK sits visibly
// wrong without its neck/shoulder fix.
const AVATARS = {
  "Brunette (Ready Player Me)": { file: "brunette.glb", body: "F", avatarMood: "neutral" },
  "Avaturn (realistic, from photo)": {
    file: "avaturn.glb", body: "F", avatarMood: "happy",
    retarget: { Hips:{y:0.03}, Spine:{y:0.02}, Spine1:{y:0.02,z:0.01},
      Spine2:{y:0.02,z:0.01}, Neck:{z:0.02,y:0.01}, Head:{z:0.02},
      LeftShoulder:{rx:-0.5}, RightShoulder:{rx:-0.5}, scaleToHipsLevel:1.0 },
    baseline: { headRotateX:-0.05, eyeBlinkLeft:0.15, eyeBlinkRight:0.15 }
  },
  "AvatarSDK (realistic, male)": {
    file: "avatarsdk.glb", body: "M", avatarMood: "neutral",
    retarget: { Neck:{z:-0.01,rx:-0.15}, Neck1:{z:-0.01,rx:-0.15},
      Neck2:{z:-0.01,rx:-0.15}, LeftShoulder:{rz:-0.3}, RightShoulder:{rz:0.3},
      scaleToEyesLevel:1.0, origin:{y:-0.1} },
    baseline: { headRotateX:-0.04, eyeBlinkLeft:0.05, eyeBlinkRight:0.05 }
  },
  "VRoid (anime style)": {
    file: "vroid.glb", body: "F", avatarMood: "neutral",
    baseline: { headRotateX:-0.1, eyeBlinkLeft:0.05, eyeBlinkRight:0.05 }
  },
  "Brunette (alternate build)": { file: "brunette-t.glb", body: "F", avatarMood: "neutral" }
};
const BACKGROUNDS = {
  "Charcoal": "#1a1a1a", "Slate": "#2b3137",
  "Deep blue": "linear-gradient(160deg,#0f2027,#203a43,#2c5364)",
  "Warm grey": "#3a3532", "Studio purple": "linear-gradient(160deg,#2b1055,#44318d)",
  "Forest": "linear-gradient(160deg,#0b3d2c,#1d6f4d)",
  "Sunset": "linear-gradient(160deg,#3a1c71,#d76d77,#ffaf7b)", "Plain white": "#f2f2f2"
};

const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;

function add(who, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerHTML = `<div class="who">${who}</div><div>${text}</div>`;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

// Float32 mic audio at the device rate -> Int16 at 16kHz, which is what
// Silero and Whisper both expect on the server side.
function downsample(buf, inRate) {
  if (inRate === SR) return buf;
  const ratio = inRate / SR;
  const out = new Float32Array(Math.round(buf.length / ratio));
  for (let i = 0; i < out.length; i++) out[i] = buf[Math.floor(i * ratio)] || 0;
  return out;
}

function toInt16(f32) {
  const out = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    out[i] = s * 32767;
  }
  return out;
}

function stopPlayback() {
  sources.forEach(s => { try { s.stop(); } catch (e) {} });
  sources = [];
  queue = [];
  nextStart = 0;
  playing = false;
  $("stop").disabled = true;
}

// Each chunk is scheduled immediately after the previous one so sentences
// run together without gaps, while still being individually stoppable.
function playPCM(int16) {
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
  const buf = ctx.createBuffer(1, f32.length, playSR);
  buf.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  const now = ctx.currentTime;
  const at = Math.max(now, nextStart || now);
  src.start(at);
  nextStart = at + buf.duration;
  sources.push(src);
  src.onended = () => { sources = sources.filter(s => s !== src); };
}

async function start() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });

  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { setStatus("listening"); $("start").disabled = true; };
  ws.onclose = () => setStatus("disconnected");

  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) {
      const pcm = new Int16Array(ev.data);
      if (head && $("avatarOn").checked && pendingTiming) {
        // speakAudio wants a real Array of ArrayBuffers holding int16 PCM --
        // its Array.isArray() check is what decides whether PCM conversion
        // runs at all (learned the hard way in the Streamlit version).
        head.speakAudio({ audio: [pcm.buffer], words: pendingTiming.words,
                          wtimes: pendingTiming.wtimes,
                          wdurations: pendingTiming.wdurations }, {}, () => {});
        pendingTiming = null;
      } else {
        playPCM(pcm);
      }
      return;
    }
    const m = JSON.parse(ev.data);
    if (m.type === "ready") {
      const sel = $("lang");
      sel.innerHTML = "";
      m.languages.forEach(l => {
        const o = document.createElement("option");
        o.value = o.textContent = l;
        if (l === m.language) o.selected = true;
        sel.appendChild(o);
      });
    } else if (m.type === "user") {
      add("you", m.text, "you");
    } else if (m.type === "assistant") {
      add("krishna", m.text);
    } else if (m.type === "status") {
      setStatus(m.text);
    } else if (m.type === "speaking_start") {
      playSR = m.sample_rate || 24000;
      playing = true; nextStart = 0;
      $("stop").disabled = false;
      setStatus("speaking — just talk to interrupt");
    } else if (m.type === "speaking_end") {
      playing = false; $("stop").disabled = true; setStatus("listening");
    } else if (m.type === "chunk_timing") {
      pendingTiming = m;
    } else if (m.type === "stop") {
      stopPlayback();
      if (head) { try { head.stopSpeaking(); } catch (e) {} }
      pendingTiming = null;
      setStatus(m.reason === "barge-in" ? "you interrupted — listening" : "stopped");
    } else if (m.type === "error") {
      add("error", m.text, "note");
    }
  };

  const src = ctx.createMediaStreamSource(micStream);
  node = ctx.createScriptProcessor(2048, 1, 1);
  let pending = new Int16Array(0);

  node.onaudioprocess = e => {
    const input = e.inputBuffer.getChannelData(0);
    let peak = 0;
    for (let i = 0; i < input.length; i++) peak = Math.max(peak, Math.abs(input[i]));
    $("levelbar").style.width = Math.min(100, peak * 240) + "%";

    if (!ws || ws.readyState !== 1) return;
    const i16 = toInt16(downsample(input, ctx.sampleRate));
    const merged = new Int16Array(pending.length + i16.length);
    merged.set(pending); merged.set(i16, pending.length);
    const full = Math.floor(merged.length / FRAME) * FRAME;
    if (full > 0) ws.send(merged.slice(0, full).buffer);
    pending = merged.slice(full);
  };

  src.connect(node);
  node.connect(ctx.destination);
}

$("start").onclick = () => start().catch(e => {
  setStatus("mic error: " + e.message);
});
$("stop").onclick = () => {
  stopPlayback();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "stop" }));
};
async function mountAvatar() {
  const { TalkingHead } = await import("/static/avatar/talkinghead.mjs");
  const box = $("avatarBox");
  box.style.display = "block";
  if (head) return;
  head = new TalkingHead(box, {
    ttsEndpoint: "", lipsyncModules: ["en"],
    cameraView: "upper", pcmSampleRate: playSR
  });
  await applyFace();
}

async function applyFace() {
  if (!head) return;
  const cfg = AVATARS[$("face").value];
  await head.showAvatar({
    url: "/static/avatar/avatars/" + cfg.file,
    body: cfg.body, avatarMood: cfg.avatarMood, lipsyncLang: "en",
    ...(cfg.retarget ? { retarget: cfg.retarget } : {}),
    ...(cfg.baseline ? { baseline: cfg.baseline } : {})
  });
}

Object.keys(AVATARS).forEach(n => {
  const o = document.createElement("option"); o.value = o.textContent = n;
  $("face").appendChild(o);
});
Object.keys(BACKGROUNDS).forEach(n => {
  const o = document.createElement("option"); o.value = o.textContent = n;
  $("bg").appendChild(o);
});
$("avatarBox").style.background = BACKGROUNDS["Charcoal"];

$("avatarOn").onchange = async e => {
  const on = e.target.checked;
  $("avatarBar").style.display = on ? "flex" : "none";
  $("avatarBox").style.display = on ? "block" : "none";
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type: "set_avatar", on }));
  if (on) { try { await mountAvatar(); } catch (err) { setStatus("avatar error: " + err.message); } }
};
$("face").onchange = () => applyFace();
$("bg").onchange = e => { $("avatarBox").style.background = BACKGROUNDS[e.target.value]; };

$("lang").onchange = e => {
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type: "set_language", language: e.target.value }));
};
</script>
</body>
</html>
